[package]
name = "luhn-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
console_error_panic_hook = "0.1.7"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2.1"

[profile.release]
opt-level = "z"          # small
lto = true
codegen-units = 1
panic = "abort"
